[package]
name = "providence-fw"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
panic-halt = "1.0.0"
cortex-m = { version = "0.7.7", features = [
    "critical-section-single-core",
    "critical-section",
] }
cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.6.1", features = ["arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers"] }
embassy-time = { version = "0.3.2", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }

# "memory-x" is left out, the layout comes from ./memory.x instead.
py32-hal = { version = "=0.2.0", default-features = false, features = [
    "rt",
    "defmt",
    "embassy",
    "time",
    "exti",
    "time-driver-tim3",
    # The PY32F002A is the same die as the F030 and has no feature of its own.
    "py32f030f16",
] }

# Per-LED brightness only exists on the unreleased `charlieplex-pwm` branch,
# so this points at the local checkout for now. Once that is tagged, replace
# the path with:
# git = "ssh://git@github.com/rough-rat/py32-badgekit.git", tag = "<new tag>"
py32-badgekit = { path = "../../../../../firmware/py32-badgekit", features = ["charlieplex"] }

defmt = "0.3"
defmt-rtt = "0.4"

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true # <-
incremental = false
opt-level = 'z'         # <-
overflow-checks = true  # <-

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false # <-
incremental = false
lto = 'fat'
opt-level = 's'          # <-
overflow-checks = false  # <-
